name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
      THEOS_PLATFORM: iphoneos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test bootstrap scope and injection filter adapters
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -Icommon tests/PXBootstrapScopeTests.m \
            -framework Foundation -framework CoreFoundation -o "$RUNNER_TEMP/px-bootstrap-scope"
          "$RUNNER_TEMP/px-bootstrap-scope"
          xcrun clang -fobjc-arc -fblocks -Icommon common/PXInjectionFilter.m \
            tests/PXInjectionFilterTests.m tests/PXInjectionFilterMain.m \
            -framework Foundation -o "$RUNNER_TEMP/px-injection-filter"
          "$RUNNER_TEMP/px-injection-filter"

      - name: Audit backup/restore hardening invariants
        run: |
          python3 scripts/audit_backup_restore_hardening.py --self-test
          python3 scripts/audit_backup_restore_hardening.py

      - name: Test canvas fingerprint protection invariants
        run: node scripts/test_canvas_fingerprint_protection.js

      - name: Test WebKit spoof P1 invariants
        run: node scripts/test_web_spoof_p1.js

      - name: Test device profile matrices
        run: |
          python3 scripts/test_device_spec_p1_1.py
          python3 scripts/test_device_spec_p1_2.py
          python3 scripts/test_device_spec_p1_3.py
          python3 scripts/test_device_profile_webgl_p2.py
          python3 scripts/test_thread_safety_cleanup_p3.py
          python3 scripts/test_storage_mount_reentrancy_static.py
          node scripts/test_webgl_profile_p2.js

      - name: Build and run malicious archive fixtures
        run: |
          set -euo pipefail
          RUNNER_TEMP_REAL="$(cd "$RUNNER_TEMP" && pwd -P)"
          FIXTURE_ROOT="$RUNNER_TEMP_REAL/px-archive-fixtures"
          FIXTURE_BIN="$RUNNER_TEMP_REAL/px-archive-fixture-tests"
          python3 tests/backup-restore-hardening/generate_archive_fixtures.py --self-test
          python3 tests/backup-restore-hardening/generate_archive_fixtures.py --output "$FIXTURE_ROOT"
          xcrun clang -fobjc-arc -fblocks -fmodules -Wno-deprecated-declarations -I. \
            PXBackupArchiveValidator.m \
            tests/backup-restore-hardening/PXArchiveFixtureHarness.m \
            -framework Foundation -lz -o "$FIXTURE_BIN"
          "$FIXTURE_BIN" "$FIXTURE_ROOT/fixtures.json"

      - name: Build and run transaction fault-injection tests
        run: |
          set -euo pipefail
          FI_ROOT="$RUNNER_TEMP/px-transaction-faults"
          PRELUDE="tests/backup-restore-hardening/PXTransactionFaultInjectionPrelude.h"
          HARNESS="tests/backup-restore-hardening/PXTransactionFaultHarness.m"
          mkdir -p "$FI_ROOT"
          COMMON_FLAGS=(-fobjc-arc -fblocks -fmodules -Wno-deprecated-declarations -Werror=implicit-function-declaration -I.)

          xcrun clang "${COMMON_FLAGS[@]}" -c PXResolvedContainer.m \
            -o "$FI_ROOT/PXResolvedContainer.o"

          build_domain() {
            local domain="$1"
            local source="$2"
            shift 2
            xcrun clang "${COMMON_FLAGS[@]}" \
              -DPX_TRANSACTION_FAULT_INJECTION=1 -include "$PRELUDE" \
              -c "$source" -o "$FI_ROOT/$domain-transaction.o"
            xcrun clang "${COMMON_FLAGS[@]}" "-DPXFI_DOMAIN_$domain=1" \
              -c "$HARNESS" -o "$FI_ROOT/$domain-harness.o"
            xcrun clang "$FI_ROOT/$domain-transaction.o" \
              "$FI_ROOT/$domain-harness.o" "$@" \
              -framework Foundation -framework CoreFoundation \
              -o "$FI_ROOT/$domain-tests"
            "$FI_ROOT/$domain-tests" --self-test
            "$FI_ROOT/$domain-tests" --run-all
          }

          build_domain MAIN PXMainDataRestoreTransaction.m \
            "$FI_ROOT/PXResolvedContainer.o"
          build_domain APP_GROUP PXAppGroupRestoreTransaction.m \
            "$FI_ROOT/PXResolvedContainer.o"
          build_domain OPTIONAL PXOptionalRestoreTransaction.m

      - name: Phase 10 repeated regression and performance gate
        run: |
          python3 scripts/release_hardening.py regression \
            --iterations 2 \
            --report release-hardening-report.json

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          set -euo pipefail

          # macos-14 runners can retain an openssl@1.1 link while ldid pulls
          # openssl@3. Remove only that known link conflict before installation.
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1 || true
          fi

          brew install ldid dpkg

          LDID_DIR="$(brew --prefix ldid)/bin"
          DPKG_DIR="$(brew --prefix dpkg)/bin"
          export PATH="$LDID_DIR:$DPKG_DIR:$PATH"

          # Fail here with a clear diagnostic instead of executing an empty
          # variable path later in the build.
          command -v ldid
          command -v dpkg
          command -v dpkg-deb
          ldid -h >/dev/null 2>&1 || true
          dpkg-deb --version

          echo "DPKG_BIN=$(command -v dpkg)" >> "$GITHUB_ENV"
          echo "$LDID_DIR" >> "$GITHUB_PATH"
          echo "$DPKG_DIR" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install Theos SDKs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_DIR/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$TMP_DIR/sdks/"* "$THEOS/sdks/"
          echo "THEOS_SDKS=$THEOS/sdks" >> "$GITHUB_ENV"
          SDK_NAME="$(ls "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]+\.[0-9]+\.sdk$' | sort -V | tail -n 1)"
          SDK_VERSION="${SDK_NAME#iPhoneOS}"
          SDK_VERSION="${SDK_VERSION%.sdk}"
          echo "SDKVERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:$SDK_VERSION:12.0" >> "$GITHUB_ENV"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build release package
        run: |
          make clean
          make package ARCHS="$ARCHS" SDKVERSION="$SDKVERSION" TARGET="$TARGET" \
            FINALPACKAGE=1 DEBUG=0 INTERNAL_SECURITY_RESEARCH=0

      - name: Audit final release package
        run: |
          PACKAGE_FILE="$(ls -t packages/*.deb | head -1)"
          python3 scripts/release_hardening.py package \
            --artifact "$PACKAGE_FILE" \
            --report package-hardening-report.json

      - name: Build and check standalone test tweak
        run: |
          echo "=== Building standalone TestCtorTweak ==="
          cd TestCtorTweak
          make clean
          make ARCHS="$ARCHS" SDKVERSION="$SDKVERSION" TARGET="$TARGET"
          echo "=== Checking TestCtorTweak dylib ==="
          TEST_DYLIB=".theos/obj/debug/arm64/TestCtorTweak.dylib"
          if [ ! -f "$TEST_DYLIB" ]; then
            TEST_DYLIB=".theos/obj/arm64/TestCtorTweak.dylib"
          fi
          if [ -f "$TEST_DYLIB" ]; then
            echo "--- File size ---"
            ls -la "$TEST_DYLIB"
            echo "--- otool -l (looking for __mod_init_func) ---"
            otool -l "$TEST_DYLIB" | grep -A10 "__mod_init_func" || echo "NO __mod_init_func section found!"
            echo "--- nm (looking for ctor) ---"
            nm "$TEST_DYLIB" 2>/dev/null | grep -i "ctor\|init" | head -10
          else
            echo "TestCtorTweak.dylib not found!"
            find . -name "*.dylib" 2>/dev/null
          fi
          cd ..

      - name: Debug - Check dylib constructors
        run: |
          echo "=== Checking dylib for constructor symbols ==="
          DYLIB_PATH=".theos/obj/debug/arm64/TLinkIOSTweak.dylib"
          if [ -f "$DYLIB_PATH" ]; then
            echo "--- File size ---"
            ls -la "$DYLIB_PATH"
            echo "--- otool -l (looking for __mod_init_func) ---"
            otool -l "$DYLIB_PATH" | grep -A10 "__mod_init_func" || echo "NO __mod_init_func section found!"
            echo "--- nm all symbols containing AAA or ctor ---"
            nm "$DYLIB_PATH" 2>/dev/null | grep -iE "AAA|_ctor|TestCtor" || echo "No AAA/ctor symbols found"
            echo "--- nm showing first 50 local symbols ---"
            nm "$DYLIB_PATH" 2>/dev/null | head -50
            echo "--- Check if .m file was compiled ---"
            ls -la ../TLinkIOSTweak/AAA_TestCtor.* 2>/dev/null || echo "Test file not found"
            echo "--- strings (looking for test constructor) ---"
            strings "$DYLIB_PATH" | grep -i "AAA_TestCtor\|weaponx_ctor" | head -10
          else
            echo "Dylib not found at $DYLIB_PATH"
            find .theos -name "*.dylib" 2>/dev/null
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tlinkios-build
          path: |
            packages/*.deb
            .theos/obj/**/TLinkIOS.app
            .theos/obj/**/TLinkIOSTweak.dylib
            .theos/obj/**/WeaponXDaemon
            release-hardening-report.json
            package-hardening-report.json
          if-no-files-found: warn

  build-roothide:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos-roothide
      ARCHS: arm64
      THEOS_PLATFORM: iphoneos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RootHide build contracts
        run: python3 scripts/test_roothide_build_static.py

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          set -euo pipefail

          # macos-14 runners can retain an openssl@1.1 link while ldid pulls
          # openssl@3. Remove only that known link conflict before installation.
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1 || true
          fi

          brew install ldid dpkg

          LDID_DIR="$(brew --prefix ldid)/bin"
          DPKG_DIR="$(brew --prefix dpkg)/bin"
          export PATH="$LDID_DIR:$DPKG_DIR:$PATH"

          # Fail here with a clear diagnostic instead of executing an empty
          # variable path later in the build.
          command -v ldid
          command -v dpkg
          command -v dpkg-deb
          ldid -h >/dev/null 2>&1 || true
          dpkg-deb --version

          echo "DPKG_BIN=$(command -v dpkg)" >> "$GITHUB_ENV"
          echo "$LDID_DIR" >> "$GITHUB_PATH"
          echo "$DPKG_DIR" >> "$GITHUB_PATH"

      - name: Set up RootHide Theos
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install Theos SDKs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_DIR/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$TMP_DIR/sdks/"* "$THEOS/sdks/"
          SDK_NAME="$(ls "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]+\.[0-9]+\.sdk$' | sort -V | tail -n 1)"
          SDK_VERSION="${SDK_NAME#iPhoneOS}"
          SDK_VERSION="${SDK_VERSION%.sdk}"
          echo "SDKVERSION=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build RootHide release package
        run: |
          make clean THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0 DEB_ARCH=iphoneos-arm64e \
            FINALPACKAGE=1 DEBUG=0 INTERNAL_SECURITY_RESEARCH=0 \
            SDKVERSION="$SDKVERSION"
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0 DEB_ARCH=iphoneos-arm64e \
            _THEOS_DEB_PACKAGE_CONTROL_PATH="$GITHUB_WORKSPACE/control.roothide" \
            FINALPACKAGE=1 DEBUG=0 INTERNAL_SECURITY_RESEARCH=0 \
            SDKVERSION="$SDKVERSION"
          PACKAGE_FILES=(packages/*_iphoneos-arm64e.deb)
          test -f "${PACKAGE_FILES[0]}"
          PACKAGE_FILE="${PACKAGE_FILES[0]}"
          test "$(dpkg-deb -f "$PACKAGE_FILE" Architecture)" = "iphoneos-arm64e"
          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/tlinkios-roothide-package.XXXXXX")"
          dpkg-deb -x "$PACKAGE_FILE" "$VERIFY_DIR"
          test -x "$VERIFY_DIR/Applications/TLinkIOS.app/TLinkIOS"
          test -x "$VERIFY_DIR/Library/WeaponX/WeaponXDaemon"
          test -x "$VERIFY_DIR/Library/WeaponX/backup_helper"
          test -f "$VERIFY_DIR/Library/LaunchDaemons/com.hydra.weaponx.guardian.plist"
          test -f "$VERIFY_DIR/usr/lib/TweakInject/TLinkIOSTweak.dylib"
          test -f "$VERIFY_DIR/usr/lib/TweakInject/TLinkIOSTweak.plist"
          test -f "$VERIFY_DIR/usr/lib/TweakInject/WeaponXKeychainBridge.dylib"
          test -f "$VERIFY_DIR/usr/lib/TweakInject/WeaponXKeychainBridge.plist"
          test ! -e "$VERIFY_DIR/Library/MobileSubstrate/DynamicLibraries/TLinkIOSTweak.dylib"
          test ! -e "$VERIFY_DIR/Library/MobileSubstrate/DynamicLibraries/WeaponXKeychainBridge.dylib"
          otool -L "$VERIFY_DIR/Applications/TLinkIOS.app/TLinkIOS" | grep -F '@loader_path/.jbroot/usr/lib/libroothide.dylib' >/dev/null
          otool -L "$VERIFY_DIR/usr/lib/TweakInject/TLinkIOSTweak.dylib" | grep -F '@loader_path/.jbroot/usr/lib/libroothide.dylib' >/dev/null
          otool -L "$VERIFY_DIR/Library/WeaponX/WeaponXDaemon" | grep -F '@loader_path/.jbroot/usr/lib/libroothide.dylib' >/dev/null
          strings "$VERIFY_DIR/Library/WeaponX/WeaponXDaemon" | grep -F -- '--sync-once' >/dev/null
          plutil -lint "$VERIFY_DIR/Library/LaunchDaemons/com.hydra.weaponx.guardian.plist"
          ldid -e "$VERIFY_DIR/Applications/TLinkIOS.app/TLinkIOS" | grep -F '<key>com.apple.private.security.storage.AppDataContainers</key>' >/dev/null
          DAEMON_ENTITLEMENTS="$(ldid -e "$VERIFY_DIR/Library/WeaponX/WeaponXDaemon")"
          printf '%s\n' "$DAEMON_ENTITLEMENTS" | grep -F '<key>platform-application</key>' >/dev/null
          printf '%s\n' "$DAEMON_ENTITLEMENTS" | grep -F '<key>com.apple.private.security.no-sandbox</key>' >/dev/null
          printf '%s\n' "$DAEMON_ENTITLEMENTS" | grep -F '<key>com.apple.private.security.storage.AppBundles</key>' >/dev/null
          printf '%s\n' "$DAEMON_ENTITLEMENTS" | grep -F '<key>com.apple.private.security.storage.AppDataContainers</key>' >/dev/null
          if printf '%s\n' "$DAEMON_ENTITLEMENTS" | grep -F '<key>aps-environment</key>' >/dev/null; then
            echo "WeaponXDaemon unexpectedly contains GUI/push entitlements"
            exit 1
          fi
          echo "Verified RootHide package: $PACKAGE_FILE"

      - name: Upload RootHide build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tlinkios-roothide-build
          path: |
            packages/*_iphoneos-arm64e.deb
            .theos/obj/**/TLinkIOS.app
            .theos/obj/**/TLinkIOSTweak.dylib
            .theos/obj/**/WeaponXDaemon
          if-no-files-found: error
